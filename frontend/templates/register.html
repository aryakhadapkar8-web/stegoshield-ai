{% extends "base.html" %}

{% block title %}Account Registration - StegoShield AI Defense Portal{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 3rem auto;">
  <div class="card card-blue">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">🛡️</div>
      <h2 style="font-family: var(--font-title); font-size: 2rem; color: var(--accent-cyan);">NEW USER REGISTRATION</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Register an account to record activity history and download stego files.</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Choose a unique username..." required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Official Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="Enter valid email address..." required>
      </div>

      <div class="form-group">
        <label class="form-label">Security Password (Min 6 chars)</label>
        <input type="password" name="password" class="form-control" placeholder="Choose a secure password..." required minlength="6">
      </div>

      <button type="submit" class="btn-gov-secondary" style="width: 100%; justify-content: center; background: var(--accent-blue); margin-top: 1.5rem;">
        🛡️ CREATE PORTAL ACCOUNT
      </button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.88rem;">
      Already registered? <a href="{{ url_for('login') }}" style="color: var(--accent-cyan); font-weight: 700; text-decoration: none;">Sign In Here</a>
    </p>
  </div>
</div>
{% endblock %}
