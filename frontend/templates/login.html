{% extends "base.html" %}

{% block title %}Portal Login - StegoShield AI Defense Portal{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;">
  <div class="card card-gold">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔑</div>
      <h2 style="font-family: var(--font-title); font-size: 2rem; color: var(--accent-gold);">DEFENSE PORTAL LOGIN</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Authenticate to access your secure steganography logs and audit metrics.</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
      <div class="form-group">
        <label class="form-label">Username or Official Email</label>
        <input type="text" name="username_or_email" class="form-control" placeholder="Enter username or email..." required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Security Passphrase / Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter password..." required>
      </div>

      <button type="submit" class="btn-gov-primary" style="width: 100%; justify-content: center; margin-top: 1.5rem;">
        🔑 SIGN IN TO SECURE PORTAL
      </button>
    </form>

    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.88rem;">
      Need a new account? <a href="{{ url_for('register') }}" style="color: var(--accent-gold); font-weight: 700; text-decoration: none;">Register Here</a>
    </p>
  </div>
</div>
{% endblock %}
